name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK with licenses accepted; AGP pulls any missing parts
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ShadohHub.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShadohHub-debug
          path: ShadohHub.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shadoh Hub build ${{ github.run_number }}
          body: |
            Debug APK built from `${{ github.sha }}`.
            Install: download **ShadohHub.apk** below and open it on your phone.
          files: ShadohHub.apk
